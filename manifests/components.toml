# Sesha Ecosystem — component manifest
#
# Every organ of the Agentic Body is declared here. The resolve-manifest script
# validates this file, checks license compatibility, resolves versions, and writes
# sesha.lock. This is the "package repository" metadata in one auditable file.
#
# Channels: stable | canary | devel  (see channels/)
# Layers:   brain | mind | soma

[ecosystem]
name = "sesha"
schema_version = 1
stable_channel = "stable"
body_doc = "docs/architecture/AGENTIC_BODY.md"

# ─────────────────────────────────────────────────────────────────────────────
# BRAIN — governance kernel (your own lineage)
# ─────────────────────────────────────────────────────────────────────────────
[component.sesha-audit]
layer = "brain"
repo = "gaganjainse/sesha-audit"
version = "0.1.0"
license = "MIT"
channel = "canary"
provides = ["audit-log", "policy-engine", "event-store"]
upstream = { name = "NexusAOS", repo = "gaganjainse/NexusAOS", ref = "main" }
notes = "Bridge to NexusAOS append-only event store and policy engine."

[component.sesha-brain]
layer = "brain"
repo = "gaganjainse/sesha-brain"
version = "0.1.0"
license = "MIT"
channel = "devel"
provides = ["task-router", "scheduler", "tool-broker"]
upstream = { name = "nexus-kernel", repo = "gaganjainse/nexus-kernel", ref = "main" }
notes = "Packaged nexusaos-kernel for desktop; routes tool calls through policy."

# ─────────────────────────────────────────────────────────────────────────────
# MIND — deliberative models (SeshaOS specialist routing, small models on 6GB)
# ─────────────────────────────────────────────────────────────────────────────
[component.sesha-mind]
layer = "mind"
repo = "gaganjainse/sesha-mind"
version = "0.1.0"
license = "MIT"
channel = "canary"
provides = ["intent", "planner", "coder", "vision"]
upstream = { name = "SeshaOS", repo = "gaganjainse/SeshaOS", ref = "main" }
models = ["phi4-mini", "qwen2.5-coder:3b", "moondream2", "nomic-embed-text"]
notes = "Model routing interface; large SeshaOS models map to 6GB-safe equivalents on the laptop."

[component.sesha-memory]
layer = "mind"
repo = "gaganjainse/sesha-memory"
version = "0.1.0"
license = "GPL-3.0"
channel = "canary"
provides = ["rag", "episodic-memory", "semantic-memory", "habit-learning", "context-assembly"]
upstream = { name = "rag-service", repo = "gaganjainse/rag-service", ref = "main" }
notes = "Hierarchical memory, habit/intention learning, token-bounded context assembly."

# ─────────────────────────────────────────────────────────────────────────────
# SOMA — the body (desktop, voice, files, devices)
# ─────────────────────────────────────────────────────────────────────────────
[component.sesha-voice]
layer = "soma"
repo = "gaganjainse/sesha-voice"
version = "1.4.5-sesha1"
license = "GPL-3.0"
channel = "canary"
provides = ["wakeword", "stt", "tts", "chat-ui", "mcp-client"]
upstream = { name = "Newelle", repo = "qwersyk/Newelle", ref = "1.4.5" }
notes = "Native (not Flatpak). STDIO MCP, wake word, faster-whisper + Piper."

[component.sesha-files]
layer = "soma"
repo = "gaganjainse/sesha-files"
version = "0.2.0"
license = "GPL-3.0"
channel = "canary"
provides = ["file-organizer", "inotify-watcher", "undo-log"]
upstream = { name = "Auto-desktopenv smart-organizer", repo = "gaganjainse/Auto-desktopenv", ref = "main" }
notes = "Rust notify watcher + Python classifier; promoted from Auto-desktopenv."

[component.sesha-shell]
layer = "soma"
repo = "gaganjainse/sesha-shell"
version = "0.1.0"
license = "GPL-3.0"
channel = "canary"
provides = ["mcp:hyprland", "window-control", "workspaces"]
notes = "Hyprland/Quickshell control MCP server."

[component.sesha-system]
layer = "soma"
repo = "gaganjainse/sesha-system"
version = "0.1.0"
license = "GPL-3.0"
channel = "canary"
provides = ["mcp:system", "power", "gpu-mux", "backup", "maintenance"]
notes = "Power/GPU/backup MCP + automations."

[component.sesha-skills]
layer = "mind"
repo = "gaganjainse/sesha-skills"
version = "0.1.0"
license = "GPL-3.0"
channel = "canary"
provides = ["mcp:skills", "notes", "web-search", "git-tools", "docs", "reminders", "skill-library"]
upstream = { name = "MCP skills pattern", repo = "modelcontextprotocol/servers", ref = "main" }
notes = "Everyday MCP tools + Markdown skills (coding, web research, docs, safety, briefing)."

# ─────────────────────────────────────────────────────────────────────────────
# PROTOCOLS & ORCHESTRATION (P0 gap fill)
# ─────────────────────────────────────────────────────────────────────────────
[component.sesha-acp]
layer = "soma"
repo = "gaganjainse/sesha-acp"
version = "0.1.0"
license = "GPL-3.0"
channel = "canary"
provides = ["acp", "editor-integration", "zed", "jetbrains"]
upstream = { name = "Agent Client Protocol", repo = "zed-industries/agent-client-protocol", ref = "main" }
notes = "ACP server so Sesha runs inside Zed/JetBrains with streaming + permissions."

[component.sesha-orchestrator]
layer = "mind"
repo = "gaganjainse/sesha-orchestrator"
version = "0.0.0"
license = "GPL-3.0"
channel = "devel"
provides = ["multi-agent", "rlm", "subagents", "a2a", "role-routing"]
upstream = { name = "Prime Agent RLM", repo = "PrimeIntellect-ai/prime-agent", ref = "main" }
notes = "PLANNED: RLM multi-agent runtime (coordinator/planner/coder/researcher/vision/critic)."

[component.sesha-harness]
layer = "mind"
repo = "gaganjainse/sesha-harness"
version = "0.1.0"
license = "GPL-3.0"
channel = "canary"
provides = ["continual-harness", "refine", "auto-skills", "self-evolution"]
upstream = { name = "Memento-Skills / Prime Harness", repo = "Memento-Teams/Memento-Skills", ref = "main" }
notes = "PLANNED: CRUD supplemental state, evidence-backed /refine, auto skill creation + rollback."

[component.sesha-phone]
layer = "soma"
repo = "gaganjainse/sesha-phone"
version = "0.1.0"
license = "GPL-3.0"
channel = "devel"
provides = ["android-adb", "phone-sensors", "phone-actuators"]
upstream = { name = "phone-harness", repo = "ShawnPana/phone-harness", ref = "main" }
notes = "ADB port of the macOS phone-harness OCR/vision→tap loop for Realme Narzo 90x."

# ─────────────────────────────────────────────────────────────────────────────
# BASE — the desktop substrate (fork of end-4, stays closest to upstream)
# ─────────────────────────────────────────────────────────────────────────────
[component.auto-desktopenv]
layer = "soma"
repo = "gaganjainse/Auto-desktopenv"
version = "rolling"
license = "GPL-3.0"
channel = "stable"
provides = ["dotfiles", "hyprland-config", "quickshell", "installer"]
upstream = { name = "dots-hyprland", repo = "end-4/dots-hyprland", ref = "main" }
notes = "The desktop body. Thin custom/ overrides; rebase upstream often."
