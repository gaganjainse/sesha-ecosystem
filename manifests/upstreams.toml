# ── Rust eBPF / File watcher / etc ──

[upstream.notify-rs]
repo = "notify-rs/notify"
ref = "main"
license = "MIT"  # no LICENSE file in repo; MIT per Cargo.toml, unverifiable from the tree
provides = ["notify-watcher"]
steal = ["Cross-platform filesystem notification library Rust 3.3k★, used by Alacritty, cargo watch, mdBook, Zed — RecommendedWatcher selects best backend inotify/FSEvents/ReadDirectoryChangesW automatically"]
improve = "Replace custom polling loop in smart-organizer --watch (audit found it wastes I/O) with notify-rs RecommendedWatcher <100ms reaction"
conflict_risk = "low — library, no conflict"

[upstream.aya-rs]
repo = "aya-rs/aya"
ref = "main"
license = "Apache-2.0"  # verified via API; was declared MIT
