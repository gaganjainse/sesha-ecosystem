improve = "Upgrade wrapper: scoped allowed dirs ~/Projects/personal, ~/Documents/Inbox, Guard deny ~/Documents/Job, ~/.ssh, tool prefixing fs_* via shesh-mcp-bundle"
conflict_risk = "low — stdio, separate process, Guard"

