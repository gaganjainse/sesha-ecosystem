[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM"]
ignore = [
  "E402",   # module imports after sys.path setup in tests/scripts
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "E402"]
"tools/swarm/*" = ["E501", "SIM105", "F841"]
"scripts/*" = ["E501"]
