[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001 (blind `except Exception`) and TRY* (exception-flow hygiene) are
# errors here, not style hints — blind catches are where silent failures
# live (2026-08-12 ecosystem-wide silent-failure sweep). Sites that must
# stay broad (daemon/process boundaries) carry `# noqa: BLE001` + a reason.
select = ["E", "F", "W", "UP", "B", "SIM", "BLE", "TRY"]
ignore = [
  "E402",   # module imports after sys.path setup in tests/scripts
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "E402"]
"tools/swarm/*" = ["E501", "SIM105", "F841"]
"tools/*" = ["E501"]
"scripts/*" = ["E501"]
