name: CI

on:
  push:
    branches: [main, canary, devel]
  pull_request:

# Least privilege by default; jobs that write declare it explicitly.
permissions: read-all

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # token not needed after clone; less leakage surface

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dev tools
        run: python -m pip install --upgrade pip ruff pytest

      - name: Lint (ruff)
        run: python -m ruff check scripts/ tests/ tools/

      - name: Lint shell scripts (bash -n + shellcheck)
        run: |
          sudo apt-get install -y -qq shellcheck
          set -e
          mapfile -t SHELLS < <(git ls-files '*.sh' '*.bash')
          echo "shell files: ${SHELLS[*]}"
          for f in "${SHELLS[@]}"; do bash -n "$f"; done
          shellcheck "${SHELLS[@]}"

      - name: Silent-failure audit (self)
        run: python tools/silent_failures.py .

      # Markdown relative links rot silently during docs restructures —
      # this gate found 21 broken links the day it was adopted.
      - name: Link integrity (docs)
        run: python tools/linkcheck.py docs

      - name: Documentation navigation (INDEX freshness + README root)
        run: python tools/docs_index.py --check

      # Workflow linter (expression injection, stale actions, embedded
      # shellcheck). Version + tarball sha256 pinned — supply-chain hygiene
      # for a lint binary we download at gate time.
      - name: actionlint (workflows)
        run: |
          curl -sfL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml

      - name: Tests (pytest)
        run: python -m pytest tests/ -q

      - name: License gate
        run: python scripts/check_licenses.py manifests/components.toml

      - name: Resolve all channels
        run: |
          python scripts/resolve_manifest.py --channel stable --out channels/stable.lock
          python scripts/resolve_manifest.py --channel canary --out channels/canary.lock
          python scripts/resolve_manifest.py --channel devel  --out channels/devel.lock

      - name: Verify locks are deterministic
        run: |
          cp channels/canary.lock /tmp/c1.lock
          python scripts/resolve_manifest.py --channel canary --out channels/canary.lock
          diff /tmp/c1.lock channels/canary.lock

      - name: Audit guard — protected paths must be denied
        run: |
          python -m pip install --quiet "git+https://github.com/gaganjainse/shesh-audit.git@main"
          python - <<'PY'
          from shesh_audit.gate import Guard

          g = Guard()  # default policy, in-memory audit at a tmp root is fine for gating
          cases = [
              ("write_file", {"path": "/home/u/.ssh/config"}, "deny"),
              ("write_file", {"path": "/home/u/.gnupg/key"}, "deny"),
              ("write_file", {"path": "/home/u/Documents/Job/cv.pdf"}, "deny"),
              ("write_file", {"path": "/home/u/Vaults/notes.md"}, "deny"),
              ("get_system_status", {}, "allow"),
              ("some_unknown_tool", {}, "confirm"),
          ]
          for tool, args, want in cases:
              d = g.check(tool, args)
              assert d.verdict == want, f"{tool}: want {want}, got {d.verdict} ({d.reason})"
          print(f"guard gate ok: {len(cases)} verdicts asserted")
          PY

      - name: Supply-chain — sign artifacts + provenance + OTLP offline export
        run: |
          python scripts/sign_artifacts.py --channel canary --artifacts channels/canary.lock manifests/components.toml --out dist/provenance.json
          cat dist/provenance.json
          # Offline OTLP sample: synthesize spans, export, validate shape.
          python - <<'PY'
          import json, time
          spans = [
              {"id": f"ci-{i}", "name": f"ci.span.{i}", "start": time.time(),
               "duration_ms": 3 + i, "status": "ok" if i else "error",
               "attributes": {"ci": "true", "i": i}}
              for i in range(2)
          ]
          with open("/tmp/ci-traces.jsonl", "w") as f:
              for s in spans:
                  f.write(json.dumps(s) + "\n")
          PY
          python scripts/export_traces_otlp.py --traces /tmp/ci-traces.jsonl --out dist/otlp-sample.json
          python - <<'PY'
          import json
          d = json.load(open("dist/otlp-sample.json"))
          spans = d["resourceSpans"][0]["scopeSpans"][0]["spans"]
          assert len(spans) == 2 and spans[0]["status"]["code"] == 2
          print("otlp sample valid")
          PY
          ls -lh dist/

      - name: Check working tree is clean (except dist)
        run: git diff --exit-code -- . ':!dist'

  depgraph:
    name: Dependency graph freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # token not needed after clone; less leakage surface

      - name: Shallow-clone component checkouts (depgraph reads sibling repos)
        run: |
          mkdir -p "$HOME/src"
          python tools/depgraph.py --list-repos | while read -r repo; do
            git clone -q --depth 1 "https://github.com/gaganjainse/$repo" "$HOME/src/$repo"
          done

      - name: Graph must equal the generated truth
        run: python tools/depgraph.py --check docs/architecture/DEPENDENCY_GRAPH.md

  workflow-lint:
    name: actionlint across all repos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # token not needed after clone; less leakage surface

      - name: Install pinned actionlint
        run: |
          curl -sfL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint

      - name: Shallow-clone component checkouts
        run: |
          mkdir -p "$HOME/src"
          python tools/depgraph.py --list-repos | while read -r repo; do
            git clone -q --depth 1 "https://github.com/gaganjainse/$repo" "$HOME/src/$repo"
          done

      - name: Lint every repo's workflows
        run: |
          set -e
          /tmp/actionlint .github/workflows/*.yml
          for repo in $(python tools/depgraph.py --list-repos); do
            wf="$HOME/src/$repo/.github/workflows"
            if [ -d "$wf" ]; then
              echo "== $repo"
              /tmp/actionlint "$wf"/*.yml
            fi
          done

  silent-failures:
    name: Silent-failure audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # token not needed after clone; less leakage surface

      - name: Shallow-clone component checkouts (auditor reads sibling repos)
        run: |
          mkdir -p "$HOME/src"
          python tools/depgraph.py --list-repos | while read -r repo; do
            git clone -q --depth 1 "https://github.com/gaganjainse/$repo" "$HOME/src/$repo"
          done

      - name: No silent failures anywhere in the ecosystem
        run: |
          set -e
          PATHS="."
          for repo in $(python tools/depgraph.py --list-repos); do
            PATHS="$PATHS $HOME/src/$repo"
          done
          # shellcheck disable=SC2086  # PATHS intentionally word-splits
          python tools/silent_failures.py $PATHS

  book-mirror:
    name: shesh-docs mirror is fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Public repo: GITHUB_TOKEN read is enough. The book tree must equal
      # a regeneration from these canonical docs, or canonical and mirror
      # have drifted — the failure message says how to fix it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gaganjainse/shesh-docs
          path: shesh-docs
          persist-credentials: false

      - name: Book tree matches canonical sources
        run: |
          DOCS_REPO="$GITHUB_WORKSPACE/shesh-docs" SRC_ROOT="$HOME/src" \
            python tools/book_build.py --check || {
              echo "shesh-docs is stale — run:"
              echo "  DOCS_REPO=<shesh-docs checkout> bash scripts/sync-docs.sh && push"
              exit 1
            }
