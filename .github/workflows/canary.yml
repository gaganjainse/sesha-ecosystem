name: Canary — multi-distro gate

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  push:
    branches: [canary]
  workflow_dispatch:

# Least privilege by default; jobs that write declare it explicitly.
permissions: read-all

concurrency:
  group: canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - archlinux@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
          - fedora@sha256:3c86d25fef9d2001712bc3d9b091fc40cf04be4767e48f1aa3b785bf58d300ed
          - ubuntu@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # token not needed after clone; less leakage surface

      - name: Bootstrap (best-effort per distro)
        run: |
          if command -v pacman; then
            pacman -Sy --noconfirm --needed python python-pip ruff git
          elif command -v dnf; then
            dnf install -y python3 python3-pip git
          elif command -v apt-get; then
            apt-get update -y && apt-get install -y python3 python3-pip git
          fi
          python3 -m pip install --break-system-packages -q ruff pytest

      - name: Gate
        run: bash scripts/gate-in-container.sh

      - name: Fetch components (manifest-driven, shallow)
        run: bash scripts/fetch-components.sh

      - name: End-to-end integration
        run: bash scripts/e2e-canary.sh
