# CodeQL scan for shesh-ecosystem itself — calls the reusable workflow below
# (the language list is this repo's only local delta; the job body lives in
# .github/workflows/codeql.yml).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 3"
  workflow_dispatch:

jobs:
  codeql:
    uses: gaganjainse/shesh-ecosystem/.github/workflows/codeql.yml@0a24bf9fa56781bb62c9992d377ee93e2b7647b5
    with:
      languages: '["python","actions"]'
