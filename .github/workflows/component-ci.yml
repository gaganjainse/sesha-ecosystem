name: Component CI (reusable)

# THE component pipeline for the shesh-* fastmcp ecosystem — Decision D1:
# ONE workflow definition here; component repos carry a thin caller that
# names only their deltas (internal deps, extra pip packages, rust gate).
# Changes land here once instead of being vendored repo-by-repo.

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions for the test matrix
        required: false
        type: string
        default: '["3.11", "3.12", "3.13"]'
      extra-pip:
        description: Extra PyPI/test packages to install (space-separated)
        required: false
        type: string
        default: ""
      existing-repos:
        description: Internal ecosystem repos installed from git@main (space-separated; not on PyPI)
        required: false
        type: string
        default: ""
      install-editable:
        description: Run pip install -e . before tests (component needs its package importable)
        required: false
        type: boolean
        default: false
      rust-manifest:
        description: Path to a Cargo.toml to fmt/clippy/test; empty disables the rust gate
        required: false
        type: string
        default: ""

# Least privilege by default; jobs that write declare it explicitly.
permissions: read-all

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      # workflow input routed through env — never inline into run: (zizmor)
      EXTRA_PIP: ${{ inputs.extra-pip }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v7.0.1
        with:
          persist-credentials: false  # token not needed after clone; less leakage surface
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install toolchain
        run: |
          # $EXTRA_PIP is a space-separated list of packages: word-split it into
          # an array (shellcheck-clean) rather than expanding it unquoted inline.
          EXTRA_PIP_ARGS=()
          if [ -n "$EXTRA_PIP" ]; then
            read -ra EXTRA_PIP_ARGS <<< "$EXTRA_PIP"
          fi
          python -m pip install --upgrade pip ruff pytest fastmcp "${EXTRA_PIP_ARGS[@]}"
      - name: Install internal ecosystem deps (not on PyPI — ecosystem tracks main)
        if: ${{ inputs.existing-repos != '' }}
        env:
          REPOS: ${{ inputs.existing-repos }}
        run: |
          set -euo pipefail
          for repo in $REPOS; do
              pip install "git+https://github.com/gaganjainse/${repo}.git@main"
          done
      - name: Install component package (editable)
        if: ${{ inputs.install-editable }}
        run: pip install -e . -q
      - name: Ruff
        run: ruff check src/ tests/
      - name: Pytest (warnings are errors)
        run: pytest tests/ -q -W error
      - name: Workflow security scan (zizmor)
        if: hashFiles('.github/workflows') != ''
        run: |
          pip install -q zizmor
          zizmor --no-online-audits --format plain .github/workflows/
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          # Pinned (no unauthenticated api.github.com call — rate-limit flake);
          # bump alongside the quarterly dependency review (docs/policies/).
          GL_VER="v8.30.1"
          curl -sfL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/${GL_VER}/gitleaks_${GL_VER#v}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .
  rust:
    if: ${{ inputs.rust-manifest != '' }}
    runs-on: ubuntu-latest
    env:
      RUST_MANIFEST: ${{ inputs.rust-manifest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v7.0.1
        with:
          persist-credentials: false  # token not needed after clone; less leakage surface
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (pinned snapshot 2026-08-13; quarterly review moves it)
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --manifest-path "$RUST_MANIFEST" --check
      - name: cargo clippy
        run: cargo clippy --manifest-path "$RUST_MANIFEST" -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path "$RUST_MANIFEST"
