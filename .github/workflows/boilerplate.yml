name: Boilerplate drift gate

on:
  schedule:
    # Weekly: catch boilerplate drift across the fleet (SECURITY/LICENSE/
    # dependabot/CI), not just on this repo's pushes.
    - cron: '45 1 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'templates/boilerplate/**'
      - 'tools/boilerplate_check.py'

permissions: read-all

jobs:
  drift:
    name: Boilerplate drift — fleet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Scan all own repos against canonical boilerplate
        run: python tools/boilerplate_check.py --fleet
