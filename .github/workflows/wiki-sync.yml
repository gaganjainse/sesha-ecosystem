name: Sync SheshAOS wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Sync wiki pages to SheshAOS.wiki
        env:
          # WIKI_PAT: a PAT with repo scope, needed to initialize/push the wiki.
          # Falls back to GITHUB_TOKEN, which works once the wiki has been
          # initialized with a first page.
          TOKEN: ${{ secrets.WIKI_PAT || github.token }}
        run: |
          set -euo pipefail
          git config --global user.name "shesh-bot"
          git config --global user.email "shesh-bot@users.noreply.github.com"
          WIKI_URL="https://x-access-token:${TOKEN}@github.com/gaganjainse/SheshAOS.wiki.git"
          if git ls-remote "$WIKI_URL" >/dev/null 2>&1; then
            echo "Wiki exists; cloning."
            git clone --depth 1 "$WIKI_URL" /tmp/wiki
          else
            echo "::warning::SheshAOS wiki is not initialized."
            echo "Create the first page at https://github.com/gaganjainse/SheshAOS/wikis"
            echo "(GitHub has no API to initialize a wiki; this is one manual click)."
            echo "After that, this workflow syncs docs/wiki/ automatically."
            exit 0
          fi
          cd /tmp/wiki
          cp "$GITHUB_WORKSPACE"/docs/wiki/*.md .
          [ -f Home.md ] || cp "$GITHUB_WORKSPACE/docs/wiki/Home.md" Home.md
          git add -A
          if git -c user.name=shesh-bot -c user.email=shesh-bot@users.noreply.github.com diff --cached --quiet; then
            echo "No wiki changes."
          else
            git -c user.name=shesh-bot -c user.email=shesh-bot@users.noreply.github.com \
              commit -m "wiki sync from shesh-ecosystem@${{ github.sha }}"
            WIKI_BRANCH=$(git ls-remote --symref "$WIKI_URL" HEAD | awk '/ref:/{sub("refs/heads/","",$2); print $2}')
            git push -u origin "HEAD:${WIKI_BRANCH:-master}"
          fi
