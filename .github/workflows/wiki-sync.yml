name: Sync SheshaAOS wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push wiki pages to SheshaAOS.wiki
        run: |
          set -euo pipefail
          cd docs/wiki
          git config --global user.name "shesha-bot"
          git config --global user.email "shesha-bot@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${{ secrets.WIKI_PAT || github.token }}@github.com/gaganjainse/SheshaAOS.wiki.git" /tmp/wiki
          # Copy every .md page; Home.md is the wiki landing page.
          for f in *.md; do
            cp "$f" "/tmp/wiki/$f"
          done
          # Also provide a Home.md alias if missing.
          [ -f /tmp/wiki/Home.md ] || cp Home.md /tmp/wiki/Home.md
          cd /tmp/wiki
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "wiki sync from shesha-ecosystem@${{ github.sha }}"
            git push
          else
            echo "No wiki changes."
          fi
