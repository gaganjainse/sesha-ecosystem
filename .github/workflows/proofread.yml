name: Proofread (canon fleet scan)

on:
  schedule:
    # Weekly: catch retired-name drift across all repos, not just on pushes.
    - cron: '15 1 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'tools/proofread.py'

permissions: read-all

concurrency:
  group: proofread-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  canon:
    name: Canon scan — fleet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Scan all public repos for retired names
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/proofread.py --fleet
